<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1012 632" width="1012" height="632" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.07"/>
    </filter>
    <!-- broker marker: the component reads and writes the broker -->
    <symbol id="db" viewBox="0 0 14 14">
      <ellipse cx="7" cy="3.5" rx="5.5" ry="2.2" fill="#e2e8f0" stroke="#64748b"/>
      <path d="M1.5 3.5v7c0 1.2 2.5 2.2 5.5 2.2s5.5-1 5.5-2.2v-7" fill="#f1f5f9" stroke="#64748b"/>
      <path d="M1.5 7c0 1.2 2.5 2.2 5.5 2.2s5.5-1 5.5-2.2" fill="none" stroke="#94a3b8"/>
    </symbol>
  </defs>

  <rect x="0" y="0" width="1012" height="632" fill="#ffffff"/>

  <!-- external processes -->
  <text x="86" y="80" text-anchor="middle" font-size="11" font-weight="600" letter-spacing="1.2" fill="#94a3b8">EXTERNAL</text>
  <g filter="url(#shadow)">
    <rect x="16" y="96" width="140" height="56" rx="11" fill="#ffffff" stroke="#e2e8f0"/>
    <rect x="16" y="206" width="140" height="56" rx="11" fill="#ffffff" stroke="#e2e8f0"/>
    <rect x="16" y="360" width="140" height="64" rx="11" fill="#ffffff" stroke="#e2e8f0"/>
  </g>
  <text x="36" y="122" font-size="13" font-weight="700" fill="#0f172a">Producer / CLI</text>
  <text x="36" y="140" font-size="10.5" fill="#64748b">enqueues tasks</text>
  <text x="36" y="232" font-size="13" font-weight="700" fill="#0f172a">Worker</text>
  <text x="36" y="250" font-size="10.5" fill="#64748b">SDK session</text>
  <text x="36" y="386" font-size="13" font-weight="700" fill="#0f172a">Webhook endpoint</text>
  <text x="36" y="404" font-size="10.5" fill="#64748b">external HTTP service</text>

  <!-- conveyord node -->
  <g filter="url(#shadow)">
    <rect x="228" y="40" width="768" height="484" rx="14" fill="#f8fafc" stroke="#e6ebf2"/>
  </g>
  <text x="244" y="66" font-size="13" font-weight="700" fill="#0f172a">conveyord node<tspan font-weight="400" fill="#64748b"> · clustered</tspan></text>

  <!-- API -->
  <rect x="244" y="96" width="140" height="284" rx="11" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="258" y="122" font-size="13" font-weight="700" fill="#3730a3">ConnectRPC API</text>
  <text x="258" y="146" font-size="10.5" fill="#475569">TaskService</text>
  <text x="258" y="164" font-size="10.5" fill="#475569">WorkerService</text>
  <text x="258" y="182" font-size="10.5" fill="#475569">AdminService</text>
  <text x="258" y="200" font-size="10.5" fill="#475569">WebhookService</text>

  <!-- actors, first column -->
  <g filter="url(#shadow)">
    <rect x="500" y="96" width="170" height="56" rx="11" fill="#ffffff" stroke="#e2e8f0"/>
    <rect x="500" y="180" width="170" height="60" rx="11" fill="#ffffff" stroke="#e2e8f0"/>
    <rect x="500" y="330" width="170" height="74" rx="11" fill="#ffffff" stroke="#e2e8f0"/>
    <rect x="500" y="434" width="170" height="60" rx="11" fill="#ffffff" stroke="#e2e8f0"/>
  </g>
  <text x="514" y="120" font-size="13" font-weight="700" fill="#0f172a">Engine</text>
  <text x="514" y="136" font-size="10.5" fill="#64748b">enqueue entry</text>
  <text x="514" y="149" font-size="10.5" fill="#64748b">hosts the actor system</text>
  <use href="#db" x="650" y="102" width="14" height="14"/>

  <text x="514" y="204" font-size="13" font-weight="700" fill="#0f172a">Gateway</text>
  <text x="514" y="220" font-size="10.5" fill="#64748b">one per worker session</text>
  <text x="514" y="233" font-size="10.5" fill="#64748b">durable transitions</text>
  <use href="#db" x="650" y="186" width="14" height="14"/>

  <text x="514" y="354" font-size="13" font-weight="700" fill="#0f172a">WebhookGateway</text>
  <text x="514" y="370" font-size="10.5" fill="#64748b">one per registration</text>
  <text x="514" y="383" font-size="10.5" fill="#64748b">JSON-RPC delivery</text>
  <text x="514" y="396" font-size="10.5" fill="#64748b">durable transitions</text>
  <use href="#db" x="650" y="336" width="14" height="14"/>

  <text x="514" y="458" font-size="13" font-weight="700" fill="#0f172a">WebhookManager</text>
  <text x="514" y="474" font-size="10.5" fill="#64748b">singleton</text>
  <text x="514" y="487" font-size="10.5" fill="#64748b">one gateway per registration</text>
  <use href="#db" x="650" y="440" width="14" height="14"/>

  <!-- actors, second column -->
  <g filter="url(#shadow)">
    <rect x="810" y="96" width="170" height="56" rx="11" fill="#ffffff" stroke="#e2e8f0"/>
  </g>
  <rect x="810" y="186" width="170" height="120" rx="11" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="824" y="120" font-size="13" font-weight="700" fill="#0f172a">Cluster singletons</text>
  <text x="824" y="136" font-size="10.5" fill="#64748b">Scheduler · Reaper</text>
  <text x="824" y="149" font-size="10.5" fill="#64748b">GroupSweeper</text>
  <use href="#db" x="960" y="102" width="14" height="14"/>

  <text x="824" y="210" font-size="13" font-weight="700" fill="#3730a3">QueueGrain</text>
  <text x="824" y="228" font-size="10.5" fill="#475569">one per queue</text>
  <text x="824" y="244" font-size="10.5" fill="#475569">dispatcher · credits</text>
  <text x="824" y="260" font-size="10.5" fill="#475569">rate &amp; concurrency limits</text>
  <use href="#db" x="960" y="192" width="14" height="14"/>

  <!-- external ⇄ API -->
  <line x1="156" y1="124" x2="244" y2="124" stroke="#cbd5e1" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="200" y="116" text-anchor="middle" font-size="10" font-weight="500" fill="#475569">Enqueue (gRPC)</text>
  <line x1="156" y1="234" x2="244" y2="234" stroke="#cbd5e1" stroke-width="2.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="200" y="226" text-anchor="middle" font-size="10" font-weight="500" fill="#475569">Session stream</text>
  <path d="M86,360 V300 H244" fill="none" stroke="#cbd5e1" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="165" y="292" text-anchor="middle" font-size="10" font-weight="500" fill="#475569">Heartbeat / ReportResult</text>
  <line x1="500" y1="392" x2="156" y2="392" stroke="#cbd5e1" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="328" y="404" text-anchor="middle" font-size="10" font-weight="500" fill="#475569">JSON-RPC POST</text>

  <!-- API → actors -->
  <line x1="384" y1="124" x2="500" y2="124" stroke="#cbd5e1" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="442" y="116" text-anchor="middle" font-size="10" font-weight="500" fill="#475569">enqueue</text>
  <line x1="384" y1="210" x2="500" y2="210" stroke="#cbd5e1" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="442" y="202" text-anchor="middle" font-size="10" font-weight="500" fill="#475569">spawn per session</text>
  <line x1="384" y1="365" x2="500" y2="365" stroke="#cbd5e1" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="442" y="357" text-anchor="middle" font-size="10" font-weight="500" fill="#475569">route async callback</text>

  <!-- Engine → QueueGrain -->
  <path d="M670,138 H745 V196 H810" fill="none" stroke="#cbd5e1" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="707" y="131" text-anchor="middle" font-size="10" font-weight="500" fill="#475569">TasksAvailable</text>

  <!-- QueueGrain ⇄ Gateway -->
  <line x1="810" y1="214" x2="670" y2="214" stroke="#cbd5e1" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="740" y="207" text-anchor="middle" font-size="9.5" font-weight="500" fill="#475569">ExecuteTask / ExecuteBatch</text>
  <line x1="670" y1="232" x2="810" y2="232" stroke="#cbd5e1" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="740" y="246" text-anchor="middle" font-size="10" font-weight="500" fill="#475569">credit + completion</text>

  <!-- QueueGrain ⇄ WebhookGateway -->
  <path d="M850,306 V352 H670" fill="none" stroke="#cbd5e1" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="760" y="345" text-anchor="middle" font-size="9.5" font-weight="500" fill="#475569">ExecuteTask / ExecuteBatch</text>
  <path d="M670,378 H880 V306" fill="none" stroke="#cbd5e1" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="760" y="391" text-anchor="middle" font-size="10" font-weight="500" fill="#475569">credit + completion</text>

  <!-- WebhookManager → WebhookGateway, singletons → QueueGrain -->
  <line x1="585" y1="434" x2="585" y2="404" stroke="#cbd5e1" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="593" y="423" font-size="10" font-weight="500" fill="#475569">spawn per registration</text>
  <line x1="895" y1="152" x2="895" y2="186" stroke="#cbd5e1" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="887" y="173" text-anchor="end" font-size="10" font-weight="500" fill="#475569">wake / FireGroup</text>

  <!-- broker -->
  <line x1="420" y1="524" x2="420" y2="550" stroke="#cbd5e1" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="804" y1="550" x2="804" y2="524" stroke="#cbd5e1" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="612" y="541" text-anchor="middle" font-size="10.5" fill="#64748b">every task, lease, schedule, and queue flag</text>
  <g filter="url(#shadow)">
    <rect x="228" y="552" width="768" height="40" rx="11" fill="#0f172a"/>
  </g>
  <text x="612" y="577" text-anchor="middle" font-size="13" font-weight="600" fill="#e2e8f0">Broker · sole durable state · Postgres / in-memory · optional encryption</text>

  <!-- legend -->
  <use href="#db" x="398" y="606" width="14" height="14"/>
  <text x="418" y="617" font-size="10.5" fill="#475569">reads and writes the broker · nothing else persists anything</text>
</svg>
